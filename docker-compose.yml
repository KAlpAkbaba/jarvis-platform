services:
  postgres:
    image: postgres:15
    container_name: jarvis_db
    environment:
      POSTGRES_PASSWORD: ***REMOVED***
      POSTGRES_DB: asistan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng
    container_name: searxng
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_SECRET_KEY: ***REMOVED***
    restart: unless-stopped

  jarvis-api:
    build: .
    container_name: jarvis_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:***REMOVED***@postgres:5432/asistan
      SEARXNG_URL: http://searxng:8080/search
      OLLAMA_URL: http://172.17.0.1:11434/api/chat
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
