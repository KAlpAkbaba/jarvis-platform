<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Asistan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #fff; font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  #sohbet { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .mesaj { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; }
  .kullanici { background: #16213e; align-self: flex-end; border-bottom-right-radius: 4px; }
  .asistan { background: #0f3460; align-self: flex-start; border-bottom-left-radius: 4px; }
  #kontroller { padding: 16px; background: #16213e; display: flex; gap: 12px; align-items: center; }
  #mikrofon-btn { width: 64px; height: 64px; border-radius: 50%; border: none; background: #e94560; cursor: pointer; font-size: 28px; flex-shrink: 0; transition: all 0.2s; }
  #mikrofon-btn.kayit { background: #ff0000; transform: scale(1.1); animation: pulse 1s infinite; }
  #metin-input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #0f3460; background: #0f3460; color: #fff; font-size: 16px; outline: none; }
  #gonder-btn { padding: 12px 20px; border-radius: 24px; border: none; background: #e94560; color: #fff; cursor: pointer; font-size: 16px; }
  #durum { text-align: center; padding: 8px; font-size: 13px; color: #aaa; background: #1a1a2e; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(233,69,96,0.4); } 50% { box-shadow: 0 0 0 12px rgba(233,69,96,0); } }
</style>
</head>
<body>
<div id="durum">Bağlanıyor...</div>
<div id="sohbet"></div>
<div id="kontroller">
  <button id="mikrofon-btn">🎤</button>
  <input id="metin-input" type="text" placeholder="Mesaj yaz..." />
  <button id="gonder-btn">Gönder</button>
</div>

<script>
const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${protocol}//${location.host}/ws`);
let mediaRecorder, chunks = [], kayitYapiliyor = false;

ws.onopen = () => durum("Bağlandı ✓");
ws.onclose = () => durum("Bağlantı kesildi");
ws.onerror = () => durum("Hata!");

ws.onmessage = (e) => {
  const mesaj = JSON.parse(e.data);
  if (mesaj.tip === "cevap") {
    mesajEkle(mesaj.metin_kullanici, "kullanici");
    mesajEkle(mesaj.metin_asistan, "asistan");
    // Sesi çal
    const blob = b64ToBlob(mesaj.ses, "audio/wav");
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.play();
    durum("Hazır");
  } else if (mesaj.tip === "hata") {
    durum("Anlaşılamadı, tekrar dene");
  }
};

function mesajEkle(metin, tip) {
  const div = document.createElement("div");
  div.className = `mesaj ${tip}`;
  div.textContent = metin;
  document.getElementById("sohbet").appendChild(div);
  div.scrollIntoView();
}

function durum(metin) {
  document.getElementById("durum").textContent = metin;
}

function b64ToBlob(b64, type) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}

// Mikrofon
document.getElementById("mikrofon-btn").onclick = async () => {
  if (!kayitYapiliyor) {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const blob = new Blob(chunks, { type: "audio/wav" });
      const reader = new FileReader();
      reader.onloadend = () => {
        const b64 = reader.result.split(",")[1];
        ws.send(JSON.stringify({ tip: "ses", veri: b64 }));
        durum("İşleniyor...");
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    kayitYapiliyor = true;
    document.getElementById("mikrofon-btn").classList.add("kayit");
    durum("Dinliyorum...");
  } else {
    mediaRecorder.stop();
    kayitYapiliyor = false;
    document.getElementById("mikrofon-btn").classList.remove("kayit");
  }
};

// Yazılı mesaj
document.getElementById("gonder-btn").onclick = () => {
  const metin = document.getElementById("metin-input").value.trim();
  if (!metin) return;
  ws.send(JSON.stringify({ tip: "metin", veri: metin }));
  document.getElementById("metin-input").value = "";
  durum("İşleniyor...");
};

document.getElementById("metin-input").onkeydown = (e) => {
  if (e.key === "Enter") document.getElementById("gonder-btn").click();
};
</script>
</body>
</html>
